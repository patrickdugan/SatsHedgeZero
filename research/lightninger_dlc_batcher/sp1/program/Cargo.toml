[package]
name = "lightninger-dlc-batch-guest"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
sp1-zkvm = { version = "=6.9.0", features = ["lib"] }
nova-snark = { version = "=0.76.0", default-features = false }
halo2curves = "0.9.0"
ff = "0.13"
bincode = "=1.3.3"
sha2 = "=0.10.9"
serde = { version = "1", features = ["derive"] }
lightninger-dlc-batch-relation = { path = "../../relation" }

# SHA-256 through SP1's precompile; field multiplication through SP1's uint256_mulmod and SHA3
# (Nova's key digest) through its Keccak precompile, as in garbled-snark-verifier nova-bitvm3 M15.
[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha2-0.10.9-sp1-4.0.0" }
sha3 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha3-0.10.8-sp1-6.2.0" }
halo2curves = { git = "https://github.com/patrickdugan/garbled-snark-verifier", rev = "f80c364fad9a0d0000426c2f208de03708e6e268" }

[workspace]

[profile.release]
strip = "symbols"
