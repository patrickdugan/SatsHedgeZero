[package]
name = "lightninger-dlc-batch-guest-script"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[[bin]]
name = "dlc-batch-guest"
path = "src/main.rs"

[dependencies]
sp1-sdk = { version = "=6.9.0" }
tokio = { version = "1.44", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
bincode = "=1.3.3"
serde_json = "1"
sha2 = "=0.10.9"
hex = "0.4"
lightninger-dlc-batch-relation = { path = "../../relation" }

[build-dependencies]
sp1-build = "=6.9.0"

[workspace]
