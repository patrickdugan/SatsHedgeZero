[package]
name = "lightninger-bitvm3-clearing"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Lightninger V3 multilateral clearing as a uniform Nova step (exact clear() + BatchClearing::digest in R1CS) and a uniform BIP-341 key-path TapSighash Nova step feeding the MNR-05 Secq256k1 BIP-340 accumulator"

[workspace]

[dependencies]
nova-snark = "=0.76.0"
ff = "0.13"
halo2curves = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
sha2 = { version = "=0.10.9", features = ["compress"] }
hex = "0.4"

shz-dex = { path = "../../crates/shz-dex" }
shz-dlc = { path = "../../crates/shz-dlc" }
shz-margin = { path = "../../crates/shz-margin" }
shz-nova-bitvm = { path = "../../crates/shz-nova-bitvm" }
shz-mnr05-bitvm3-ln-dlc = { path = "../mnr05_bitvm3_ln_dlc" }
# M17 (Bitcoin Script on Nova, Pallas/Vesta) with Taproot: garbled-snark-verifier nova-bitvm3/m17
m17-nova-script = { git = "https://github.com/patrickdugan/garbled-snark-verifier", rev = "f80c364fad9a0d0000426c2f208de03708e6e268" }

[profile.release]
panic = "unwind"

[profile.test]
opt-level = 3

[dev-dependencies]
k256 = { version = "0.13", features = ["arithmetic", "schnorr", "ecdsa", "sha256"] }
