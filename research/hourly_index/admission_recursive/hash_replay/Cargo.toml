[package]
name = "shz-stark-hash-replay"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
[workspace]
[dependencies]
risc0-core = { version = "=3.0.2", default-features = false }
risc0-zkp = { version = "=3.0.6", default-features = false }
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["std", "disable-dev-mode"] }
shz-stark-fast-hash = { path = "../fast_hash" }
bincode = "=1.3.3"
sha2 = "0.10"
hex = "0.4"
serde_json = "1"

[profile.release]
opt-level = 3
panic = "unwind"
