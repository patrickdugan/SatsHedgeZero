[package]
name = "shz-stark-fast-hash"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
[workspace]
[dependencies]
risc0-core = { version = "=3.0.2", default-features = false }
risc0-zkp = { version = "=3.0.6", default-features = false }
[dev-dependencies]
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["std", "disable-dev-mode"] }
bincode = "=1.3.3"
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
