[package]
name = "shz-stark-hash-compact"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
[workspace]
[dependencies]
risc0-core = { version = "=3.0.2", default-features = false }
risc0-zkp = { version = "=3.0.6", default-features = false }
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["std", "disable-dev-mode"] }
shz-stark-hash-replay = { path = "../hash_replay" }
hex = "0.4"
serde_json = "1"
[profile.release]
opt-level = 3
panic = "unwind"
