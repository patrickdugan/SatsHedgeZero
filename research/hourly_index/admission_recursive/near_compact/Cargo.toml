[package]
name = "shz-near-stark-compact"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
[lib]
crate-type = ["cdylib","rlib"]
[workspace]
[dependencies]
near-sdk = { version = "=5.17.2", features = ["legacy"] }
shz-stark-hash-compact = { path = "../hash_compact" }
shz-admission-recursive-core = { path = "../core" }
hex = "0.4"
[profile.release]
opt-level = 3
lto = true
panic = "abort"
overflow-checks = true
codegen-units = 1
strip = "symbols"
