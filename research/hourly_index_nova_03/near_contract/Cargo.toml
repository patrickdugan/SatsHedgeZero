[package]
name = "shz-index03-near-verifier"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Transparent Nova checkpoint verifier, Pyth/Chainlink source authenticator, and Bitcoin SHZIDX01 SPV light-client anchor on NEAR WASM"

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
near-sdk = { version = "=5.17.2", features = ["legacy", "unstable"] }
ff = "0.13"
halo2curves = { version = "0.9", default-features = false, features = ["bits", "derive_serde"] }
bincode = "1.3"
hex = "0.4"
sha2 = "=0.10.9"
sha3 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "=5.17.2", features = ["legacy", "unstable", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true
