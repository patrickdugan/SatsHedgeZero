[package]
name = "shz-index03-prover"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "SHZ-INDEX-03 transparent Nova prover, verifier workload profiler, Pyth/Chainlink authenticator, and NEAR proof-bundle exporter"

[workspace]

[dependencies]
nova-snark = "=0.76.0"
ff = "0.13"
halo2curves = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
sha3 = "0.10"
hex = "0.4"
bincode = "1.3"
rand_core = { version = "0.6", features = ["getrandom"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
k256 = { version = "0.13", features = ["ecdsa", "schnorr", "arithmetic"] }
shz-oracle = { path = "../../../crates/shz-oracle" }
shz-dlc = { path = "../../../crates/shz-dlc" }
shz-margin = { path = "../../../crates/shz-margin" }

[profile.release]
panic = "unwind"
