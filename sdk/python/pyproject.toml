[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lightninger"
version = "1.0.0"
description = "Agent SDK for the Lightninger testnet venue: delegated agent keys, agent API v1 (REST + JSON-RPC/WebSocket). Stdlib only."
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
dependencies = []

[project.scripts]
lightninger = "lightninger.__main__:main"

[tool.setuptools]
packages = ["lightninger"]
