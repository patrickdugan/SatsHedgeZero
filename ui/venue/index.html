<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lightninger</title>
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#000000">
<script>try{if(localStorage.getItem("lightninger.ui")==="classic")document.documentElement.dataset.ui="classic"}catch(e){}</script>
<link rel="stylesheet" href="venue.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <a class="brand" href="index.html" aria-label="Lightninger"><img class="mk" src="brand/lightninger-mark.svg" alt=""><img class="wm" src="brand/lightninger-wordmark.svg" alt="Lightninger"><span class="tag testnet">TESTNET</span></a>
    <select id="market" aria-label="Market"><option>SHZ-BTCUSD-INV</option></select>
    <span class="seg" id="viewseg" role="group" aria-label="Product" data-options hidden><button data-v="perps" class="on">Perpetual</button><button data-v="options">Options</button><button data-v="spot" data-spot hidden>Spot</button></span>
    <span><span class="lbl">Oracle mark</span><span id="mark" class="mark">&mdash;</span></span>
    <a id="frost" class="badge warn" href="explorer.html#/packet">FROST 3-of-5 signed</a>
    <span><span class="lbl">Mark age</span><span id="markage" class="mono">&mdash;</span></span>
    <span><span class="lbl">Resting / batch</span><span id="routerinfo" class="mono">&mdash;</span></span>
    <span class="grow"></span>
    <span class="seg" id="toptier" role="group" aria-label="Tier"><button data-tier="standard">Standard</button><button data-tier="intermediate">Intermediate</button><button data-tier="premium">Premium</button></span>
    <span id="conn" class="badge warn">connecting</span>
    <button id="wbtn" class="wbtn" type="button">Connect wallet</button>
    <button id="sbtn" class="btn sm" type="button" aria-label="Settings">&#9881; Settings</button>
    <a href="explorer.html">Explorer</a>
  </header>
  <main class="grid">
    <section class="panel chart"><iframe id="chart" title="SHZ-BTCUSD-INV chart" sandbox="allow-scripts allow-same-origin"></iframe></section>
    <section class="panel bookcol">
      <h3>Order book <span class="mono muted">USD</span></h3>
      <div class="colhead"><span>Price</span><span>Size USD</span><span>Total</span></div>
      <div class="book"><div class="side asks" id="asks"></div><div class="spread" id="spread"></div><div class="side bids" id="bids"></div></div>
      <h3>Recent trades</h3>
      <div class="trades" id="trades"></div>
    </section>
    <section class="panel formcol">
      <div class="tabs" id="otabs"><button data-t="limit" class="on">Limit</button><button data-t="market">Market (FOK)</button></div>
      <div class="form">
        <div class="sides" id="sides"><button class="long on" data-s="long">Long</button><button class="short" data-s="short">Short</button></div>
        <label class="f">Size (USD notional)<input type="number" id="size" min="1" step="1" value="5"></label>
        <label class="f" id="pricewrap">Limit price (USD)<input type="number" id="price" min="1" step="1"></label>
        <label class="f">Leverage <span id="levv" class="mono">3x</span><input type="range" id="lev" min="1" max="10" step="1" value="3"></label>
        <div class="seg" id="ftier" style="border-color:var(--border-strong)"><button data-tier="standard" style="color:var(--text-secondary)">Standard</button><button data-tier="intermediate" style="color:var(--text-secondary)">Intermediate</button><button data-tier="premium" style="color:var(--text-secondary)">Premium</button></div>
        <div class="est" id="est"></div>
        <button class="go long" id="go">Place order</button>
        <div class="msg" id="omsg"></div>
      </div>
      <div class="wallet" id="wallet"></div>
    </section>
    <section class="panel optchain" id="optchain" aria-label="Options chain"></section>
    <section class="panel formcol optticket" id="optticket" aria-label="Options ticket"></section>
    <section class="panel spotchart" aria-label="BTC/USDT spot chart"><iframe id="spotframe" title="SHZ-BTCUSDT-SPOT chart" sandbox="allow-scripts allow-same-origin"></iframe></section>
    <section class="panel bookcol spotbook" id="spotbook" aria-label="BTC/USDT spot book">
      <h3>BTC / USDT spot <span class="mono muted">USDT &middot; BTC</span></h3>
      <div class="colhead"><span>Price</span><span>Size BTC</span><span>Total</span></div>
      <div class="book"><div class="side asks" id="sasks"></div><div class="spread" id="sspread"></div><div class="side bids" id="sbids"></div></div>
      <h3>Spot trades</h3>
      <div class="trades" id="stape"></div>
    </section>
    <section class="panel formcol spotticket" id="spotticket" aria-label="Spot ticket"></section>
    <section class="panel bottom">
      <div class="tabs" id="btabs"><button data-t="positions" class="on">Positions</button><button data-t="orders">Open orders</button><button data-t="fills">Fills</button><button data-t="settle">Settlement</button><button data-t="collateral" data-coll hidden>Collateral</button><button data-t="options" data-options hidden>Options</button><button data-t="spot" data-spot hidden>Spot</button></div>
      <div class="scroll" id="bpane"></div>
    </section>
  </main>
  <footer class="foot"><img src="brand/lightninger-powered-by.svg" alt="Powered by Lightninger"></footer>
</div>
<div id="wmodal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="wmtitle"><div class="mbox"><div class="mhead"><span class="ttl"><img class="mk" src="brand/lightninger-mark-speed.svg" alt=""><h2 id="wmtitle">Connect wallet</h2></span><button id="wmclose" class="btn sm" type="button" aria-label="Close">&times;</button></div><div id="wmbody"></div></div></div>
<div id="smodal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="smtitle"><div class="mbox"><div class="mhead"><h2 id="smtitle">Settings</h2><button id="smclose" class="btn sm" type="button" aria-label="Close">&times;</button></div><div id="sbody"></div><div id="sagents"></div></div></div>
<script type="module" src="venue.js"></script>
</body>
</html>
