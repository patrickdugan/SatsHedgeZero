name: ZKL-30 pruned-matrix plan, composed Lean replay and patched-Nova compile check
on:
  pull_request:
    paths:
      - 'research/zk_lean/zkl30_plan.py'
      - 'research/zk_lean/test_zkl30.py'
      - 'research/zk_lean/zkl30/**'
      - '.github/workflows/shz-zkl30.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Plan regressions
        run: cd research/zk_lean && python -m unittest test_zkl30 -v
      - uses: actions/download-artifact@v4
        with:
          name: zkl22-nova-setup-capture
          path: captured
          run-id: 46042490831
          github-token: ${{ github.token }}
      - name: Deletion plans with exact expected pruned hashes (both matrices)
        shell: bash
        run: |
          set -euo pipefail
          ulimit -v 524288
          test "$(cat captured/source-commit.txt)" = 7b8d60305a8338f9fe26403d031383377bcf3d4c
          echo 'ffb298ecbb4e923beba2ad1ee907588507ddc57c1bd91237156c18d6f8f5684a  captured/capture.json' | sha256sum -c -
          mkdir -p zkl30-export
          for side in primary secondary; do
            gzip -d "captured/$side.rows.jsonl.gz"
            pin="$(python -c 'import json,sys; print(json.load(open("research/zk_lean/zkl22_capture_pins.json"))[sys.argv[1]])' "$side")"
            /usr/bin/time -v python research/zk_lean/zkl30_plan.py "captured/$side.rows.jsonl" \
              --expected-original "$pin" --candidates 5209,5444 --around-dead 8 --out "zkl30-out/$side" \
              2> "zkl30-export/$side-plan.time.txt" > /dev/null
            grep -E 'Maximum resident|Elapsed' "zkl30-export/$side-plan.time.txt"
            cp "zkl30-out/$side/plan.json" "zkl30-export/$side-plan.json"
            cp "zkl30-out/$side/PrunedMatrix.lean" "zkl30-export/$side-PrunedMatrix.lean"
          done
      - uses: actions/checkout@v4
        with:
          repository: patrickdugan/MathCan
          ref: 45747ba240e2c941e7e2590af415ccf670b64452
          path: mathcan
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: mathcan
          auto-config: false
          build: true
          build-args: MathCan.ZKLeanCompose
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Kernel replay of the composed pruned-matrix theorems
        shell: bash
        run: |
          set -euo pipefail
          cd mathcan
          for side in primary secondary; do
            printf 'REPLAY %s\n' "$side" | tee -a ../zkl30-export/replay-axioms.txt
            lake env lean "../zkl30-export/$side-PrunedMatrix.lean" | tee -a ../zkl30-export/replay-axioms.txt
          done
          test "$(grep -c "'pruned_matrix_equiv' depends on axioms" ../zkl30-export/replay-axioms.txt)" -eq 2
          if grep -Eq 'sorryAx|ofReduceBool|Classical.choice' ../zkl30-export/replay-axioms.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zkl30-plan
          path: |
            zkl30-out
            zkl30-export
      - name: Export (slice 0)
        if: always()
        run: python research/zk_lean/ci_export.py --name zkl30 --slice 0 zkl30-export
      - name: Export (slice 1)
        if: always()
        run: python research/zk_lean/ci_export.py --name zkl30 --slice 1 zkl30-export
  patched-nova-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Patch nova-snark 0.76.0 and compile (no setup, no proving)
        shell: bash
        run: |
          set -euo pipefail
          bash research/zk_lean/zkl30/prepare_pruned_build.sh "$GITHUB_WORKSPACE" /tmp/nova-zkl30
          cargo build --release --manifest-path research/mnr05_bitvm3_ln_dlc/Cargo.toml --bin shz-mnr05-bitvm3-ln-dlc --example zkl_capture
          grep -c "zkl30::Skip::new" /tmp/nova-zkl30/src/nova/mod.rs
