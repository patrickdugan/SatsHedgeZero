name: SHZ RGB sidecar and withdrawal bridge
on:
  pull_request:
    paths:
      - 'integrations/utexo-rgb/**'
      - 'crates/shz-dex/src/routing.rs'
      - 'crates/shz-dex/src/routing/withdrawal.rs'
      - 'crates/shz-dex/src/routing/tiered.rs'
      - 'crates/shz-dex/src/routing/tiered_durable.rs'
      - 'crates/shz-dex/tests/shz_rgb01e_withdrawals.rs'
      - 'crates/shz-dex/examples/shz_withdrawal_vectors.rs'
      - 'crates/shz-dex/examples/shz_withdrawal_cli.rs'
      - 'docs/SHZ_RGB_WITHDRAWAL.md'
      - '.github/workflows/shz-rgb-sidecar-ci.yml'
  push:
    paths:
      - 'integrations/utexo-rgb/**'
      - 'crates/shz-dex/src/routing.rs'
      - 'crates/shz-dex/src/routing/withdrawal.rs'
      - 'crates/shz-dex/src/routing/tiered.rs'
      - 'crates/shz-dex/src/routing/tiered_durable.rs'
      - 'crates/shz-dex/tests/shz_rgb01e_withdrawals.rs'
      - 'crates/shz-dex/examples/shz_withdrawal_vectors.rs'
      - 'crates/shz-dex/examples/shz_withdrawal_cli.rs'
      - 'docs/SHZ_RGB_WITHDRAWAL.md'
      - '.github/workflows/shz-rgb-sidecar-ci.yml'
permissions:
  contents: read
jobs:
  rust-withdrawal-and-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run SHZ-RGB-01E withdrawal state machine and exhaustive small-state tests
        run: cargo test -p shz-dex --test shz_rgb01e_withdrawals --locked
      - name: Run shz-dex strict clippy check
        run: cargo clippy -p shz-dex --all-targets --locked -- -D warnings
      - name: Verify cross-language golden vectors are up to date
        run: |
          cargo run -p shz-dex --locked --example shz_withdrawal_vectors > /tmp/generated-vectors.json
          diff -u integrations/utexo-rgb/withdrawal-vectors.json /tmp/generated-vectors.json

  sidecar-and-bridge:
    runs-on: ubuntu-latest
    needs: rust-withdrawal-and-vectors
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run sidecar unit, crash, observer, and cross-language bridge tests
        run: npm --prefix integrations/utexo-rgb test
      - name: Syntax check native regtest and SHZ-RGB-02 scripts
        run: |
          node --check integrations/utexo-rgb/benchmark.mjs
          node --check integrations/utexo-rgb/native-worker.mjs
          node --check integrations/utexo-rgb/regtest-nia-benchmark.mjs
          node --check integrations/utexo-rgb/adversarial-recovery.mjs
          node --check integrations/utexo-rgb/shz-rgb02-atomic-swap.mjs
