name: shz-public-l2-day-calibration
on:
  push:
    branches: ["research/l2-day-calibration-*"]
    paths: ["research/public_l2/**", ".github/workflows/shz-public-l2-day-calibration.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        day: ["2026-10-11", "2026-11-23"]
        start: [0,6,12,18]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify fixtures and install decoder
        run: |
          python research/public_l2/pilot.py --selftest
          python research/public_l2/aggregate_day.py --selftest
          pip install 'pyarrow>=16,<24'
      - name: Download and replay six fixed hours
        env:
          DAY: ${{ matrix.day }}
          START: ${{ matrix.start }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/l2-results"; mkdir -p "$out"
          raw="$RUNNER_TEMP/l2-btc.parquet"
          trap 'rm -f "$raw"' EXIT
          for i in $(seq "$START" "$((START+5))"); do
            hour=$(printf '%02d' "$i")
            rm -f "$raw"
            if curl --fail --silent --show-error --location --retry 2 --retry-delay 3 --max-time 120 --max-filesize 200000000 "https://api.cryptohftdata.com/v1/download?file=lighter/$DAY/$hour/BTC_orderbook.parquet" -o "$raw"; then
              if ! python research/public_l2/pilot.py --book "$raw" --hour "${DAY}T${hour}:00:00" --output "$out/$DAY-$hour.summary.json" >> "$out/hourly.jsonl"; then
                printf '%s,%s,replay_failed\n' "$DAY" "$hour" >> "$out/failures.csv"
              fi
            else
              printf '%s,%s,download_failed\n' "$DAY" "$hour" >> "$out/failures.csv"
            fi
            rm -f "$raw"
            sleep 1.1
          done
          ls -lh "$out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l2-day-${{ matrix.day }}-${{ matrix.start }}
          path: ${{ runner.temp }}/l2-results
          retention-days: 14
  aggregate:
    needs: replay
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: l2-day-*
          path: hourly
      - run: python research/public_l2/aggregate_day.py --root hourly --output summary.json | tee report.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: l2-day-aggregate
          path: |
            summary.json
            report.jsonl
          retention-days: 14
