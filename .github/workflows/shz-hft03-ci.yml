name: shz-hft03-coalescer
on:
  push:
    branches: ["research/shz-hft03-*"]
    paths:
      - "crates/shz-dex/**"
      - ".github/workflows/shz-hft03-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --release -p shz-dex -p shz-dlc -p shz-margin
