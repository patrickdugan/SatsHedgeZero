name: shz-rust-and-core-regtest

on:
  push:
    branches: ["main", "feat/**", "research/**"]
  pull_request:

jobs:
  rust-and-mnr02-regtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.99.0+
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run workspace unit and e2e tests
        run: cargo test --workspace --locked

      - name: Run strict clippy check
        run: |
          # Errors are also emitted as annotations (readable without sign-in).
          if ! cargo clippy --workspace --all-targets --locked --message-format=short -- -D warnings > clippy.txt 2>&1; then
            grep -vE '^\s*(Compiling|Checking|Blocking|Downloaded|Downloading|Updating|Locking)' clippy.txt | grep -E 'error|warning' | head -10 | while IFS= read -r l; do echo "::error title=clippy::$l"; done
            exit 1
          fi

      - name: Run synthetic and Nova/BitVM3 verification suites
        run: |
          cargo run --locked --bin shz -- verify-all
          cargo run --locked --bin shz -- nova-demo > /dev/null

      - name: Run SHZ-HFT-01/02 WebSocket load and 100ms LN coalescer gates
        run: cargo run --release --locked -p shz-hftd --bin shz-mm-bot -- --intents 6000 --max-p99-us 5000

      - name: Run Deribit terminal HTTP API and workbench tests
        run: npm --prefix ui test

      - name: Verify NEAR/Pyth provenance and multi-channel closeout research gates
        run: npm --prefix research/near_pyth_channel test

      - name: Install SHA256-pinned Bitcoin Core 31.1 and execute SHZ-MNR-02 + SHZ-MNR-03 regtest & reorg drills
        run: |
          curl -fsSL -o /tmp/bitcoin-31.1.tar.gz https://bitcoincore.org/bin/bitcoin-core-31.1/bitcoin-31.1-x86_64-linux-gnu.tar.gz
          echo "b80d9c3e04da78fb6f0569685673418cf686fadba9042d926d13fb87ff503f9e  /tmp/bitcoin-31.1.tar.gz" | sha256sum -c -
          tar -xzf /tmp/bitcoin-31.1.tar.gz -C /tmp
          cargo run --locked --bin shz -- mnr02-regtest /tmp/bitcoin-31.1/bin/bitcoind
          cargo run --locked --bin shz -- mnr03-regtest /tmp/bitcoin-31.1/bin/bitcoind > /dev/null

  near-fraud-guard-wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run NEAR bonded fraud-guard VMContext unit tests
        run: cargo test --manifest-path research/near_pyth_channel/near_contract/Cargo.toml --locked

      - name: Compile NEAR bonded oracle contract for WebAssembly
        run: cargo check --manifest-path research/near_pyth_channel/near_contract/Cargo.toml --target wasm32-unknown-unknown --locked
