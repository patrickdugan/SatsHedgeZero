# Local deployment of the HFT-06 trusted relay with the synthetic source.
#   shz-relay dev-config --dir deploy/hft06 --ws 0.0.0.0:9440 --http 0.0.0.0:9441 --state /var/lib/shz/state
#   shz-relay keygen --out deploy/hft06/secrets/relay.key
#   docker compose -f deploy/hft06/docker-compose.yml up --build
services:
  relay:
    build:
      context: ../..
      dockerfile: deploy/hft06/Dockerfile
    command: ["serve", "--config", "/etc/shz/relay.local.json"]
    env_file: [.env]
    environment:
      SHZ_RELAY_SIGNING_KEY_FILE: /run/secrets/relay.key
    volumes:
      - ./relay.local.json:/etc/shz/relay.local.json:ro
      - relay-state:/var/lib/shz/state
    secrets: [relay.key]
    ports:
      - "127.0.0.1:9440:9440"
      - "127.0.0.1:9441:9441"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9441 && printf 'GET /healthz HTTP/1.0\r\n\r\n' >&3 && grep -q '\"status\":\"ok\"' <&3"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
secrets:
  relay.key:
    file: ./secrets/relay.key
volumes:
  relay-state: {}
