[package]
name = "shz-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "HFT-06 oracle collator service and tiered trusted/federated packet relay (WebSocket, checkpoints, metrics)."

[features]
default = []
# Live provider connectors (Pyth Pro/Lazer, Chainlink Data Streams) over TLS.
live = ["tokio-tungstenite/native-tls"]

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hex.workspace = true
hmac.workspace = true
rand_core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shz-dlc.workspace = true
shz-oracle.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "signal", "fs"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }

[[bin]]
name = "shz-collator"
path = "src/bin/shz-collator.rs"

[[bin]]
name = "shz-relay"
path = "src/bin/shz-relay.rs"
